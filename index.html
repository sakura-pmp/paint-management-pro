<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paint Management Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { 950: '#09090b', 900: '#121215', 800: '#1c1c21', 700: '#27272e' },
                        gold: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' }
                    }
                }
            }
        }
    </script>
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <style>
        body { background-color: #09090b; color: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row pb-24 md:pb-0">

    <!-- Desktop Sidebar -->
    <aside class="hidden md:flex md:w-64 md:flex-col md:fixed md:inset-y-0 bg-dark-900 border-r border-dark-700 z-30">
        <div class="p-6 border-b border-dark-700">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-gold-400 to-gold-600 flex items-center justify-center text-dark-950 font-black text-xl shadow-lg">P</div>
                <div>
                    <h1 class="font-black text-white tracking-tight text-lg leading-tight">Paint Pro</h1>
                    <p class="text-xs text-gold-400 font-semibold">現場・在庫・施工管理</p>
                </div>
            </div>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <button id="nav-projects" onclick="switchTab('projects')" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-xl font-bold text-sm transition-all bg-gold-500 text-dark-950 shadow-lg shadow-gold-500/20">
                <span>📋</span><span>案件登録</span>
            </button>
            <button id="nav-materials" onclick="switchTab('materials')" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-xl font-bold text-sm transition-all text-gray-400 hover:bg-dark-800 hover:text-white">
                <span>🪣</span><span>材料・在庫管理</span>
            </button>
            <button id="nav-customers" onclick="switchTab('customers')" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-xl font-bold text-sm transition-all text-gray-400 hover:bg-dark-800 hover:text-white">
                <span>🏠</span><span>顧客・施工管理</span>
            </button>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 md:pl-64">
        <!-- Top Group Sync Bar -->
        <header class="sticky top-0 z-20 bg-dark-900/95 backdrop-blur border-b border-dark-700 px-4 py-3">
            <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-2">
                <div class="flex items-center gap-2">
                    <span class="w-7 h-7 rounded-lg bg-gold-500 text-dark-950 font-black flex items-center justify-center text-sm md:hidden">P</span>
                    <span class="text-xs font-bold text-gold-400">グループ合言葉:</span>
                    <input id="group-input" type="text" value="hachioji-paint" placeholder="合言葉を入力" class="bg-dark-800 border border-dark-700 rounded-lg px-2.5 py-1 text-xs text-white font-bold w-32 focus:outline-none focus:border-gold-500">
                    <button onclick="changeGroup()" class="bg-gold-500 hover:bg-gold-400 text-dark-950 font-bold text-xs px-3 py-1.5 rounded-lg transition">共有</button>
                </div>
                <div id="sync-status" class="text-xs font-semibold text-emerald-400 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span>同期待機中</span>
                </div>
            </div>
        </header>

        <div class="max-w-5xl mx-auto p-4 md:p-8 space-y-6">

            <!-- TAB 1: 案件登録 -->
            <section id="tab-projects" class="space-y-6">
                <div>
                    <h2 class="text-2xl font-black text-white">案件登録</h2>
                    <p class="text-sm text-gray-400 mt-1">新規の現場案件・日程・使用予定塗料を登録します</p>
                </div>

                <form id="project-form" onsubmit="addProject(event)" class="bg-dark-900 border border-dark-700 rounded-2xl p-5 space-y-4 shadow-xl">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-400 mb-1">顧客名・現場名 <span class="text-gold-400">*</span></label>
                            <input id="proj-name" type="text" required placeholder="例：山田様邸 外壁塗装工事" class="w-full bg-dark-800 border border-dark-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-gold-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-400 mb-1">住所・エリア</label>
                            <input id="proj-address" type="text" placeholder="例：八王子市下恩方町" class="w-full bg-dark-800 border border-dark-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-gold-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-400 mb-1">見積日</label>
                            <input id="proj-est-date" type="date" class="w-full bg-dark-800 border border-dark-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-gold-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-400 mb-1">着工日</label>
                            <input id="proj-start-date" type="date" class="w-full bg-dark-800 border border-dark-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-gold-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-400 mb-1">完工予定日</label>
                            <input id="proj-end-date" type="date" class="w-full bg-dark-800 border border-dark-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-gold-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-400 mb-1">使用塗料・仕様</label>
                            <input id="proj-paint" type="text" placeholder="例：パーフェクトトップ" class="w-full bg-dark-800 border border-dark-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-gold-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-400 mb-1">色番号・カラー（自由入力）</label>
                            <input id="proj-color" type="text" placeholder="例：22-90B / 艶消し黒" class="w-full bg-dark-800 border border-dark-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-gold-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1">備考・現場メモ</label>
                        <textarea id="proj-notes" rows="2" placeholder="足場日程、鍵の場所、注意事項など" class="w-full bg-dark-800 border border-dark-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-gold-500"></textarea>
                    </div>

                    <button type="submit" class="w-full bg-gradient-to-r from-gold-500 to-gold-600 hover:from-gold-400 hover:to-gold-500 text-dark-950 font-black py-3.5 rounded-xl shadow-lg shadow-gold-500/20 transition text-base">
                        ＋ 案件を登録する
                    </button>
                </form>

                <!-- Registered Projects List -->
                <div class="space-y-3">
                    <h3 class="text-base font-bold text-gray-300">登録済み案件一覧</h3>
                    <div id="projects-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                </div>
            </section>

            <!-- TAB 2: 材料・在庫管理 -->
            <section id="tab-materials" class="hidden space-y-6">
                <div class="flex flex-wrap items-center justify-between gap-3">
                    <div>
                        <h2 class="text-2xl font-black text-white">材料・在庫管理</h2>
                        <p class="text-sm text-gray-400 mt-1">塗料缶の残量（kg）計測と在庫一覧出力</p>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="connectBLE()" id="ble-btn" class="bg-dark-800 hover:bg-dark-700 border border-gold-500/50 text-gold-400 font-bold text-xs px-3.5 py-2.5 rounded-xl transition flex items-center gap-1.5">
                            <span>📡</span><span id="ble-text">BLEはかり接続</span>
                        </button>
                        <button onclick="exportCSV()" class="bg-dark-800 hover:bg-dark-700 border border-dark-700 text-white font-bold text-xs px-3.5 py-2.5 rounded-xl transition">
                            📥 CSV出力
                        </button>
                        <button onclick="copyInventoryList()" class="bg-gold-500 hover:bg-gold-400 text-dark-950 font-bold text-xs px-3.5 py-2.5 rounded-xl transition">
                            📋 リストコピー
                        </button>
                    </div>
                </div>

                <!-- Add Material Form -->
                <form onsubmit="addMaterial(event)" class="bg-dark-900 border border-dark-700 rounded-2xl p-4 grid grid-cols-1 sm:grid-cols-4 gap-3">
                    <input id="mat-name" type="text" required placeholder="材料名（例：ファインSi）" class="bg-dark-800 border border-dark-700 rounded-xl px-3.5 py-2.5 text-white text-sm focus:outline-none focus:border-gold-500">
                    <input id="mat-color" type="text" placeholder="色番号（例：N-90）" class="bg-dark-800 border border-dark-700 rounded-xl px-3.5 py-2.5 text-white text-sm focus:outline-none focus:border-gold-500">
                    <input id="mat-weight" type="number" step="0.1" required placeholder="残量 kg（例：14.5）" class="bg-dark-800 border border-dark-700 rounded-xl px-3.5 py-2.5 text-white text-sm focus:outline-none focus:border-gold-500">
                    <button type="submit" class="bg-gold-500 hover:bg-gold-400 text-dark-950 font-black rounded-xl py-2.5 text-sm transition">
                        ＋ 材料追加
                    </button>
                </form>

                <div id="materials-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </section>

            <!-- TAB 3: 顧客・施工管理 -->
            <section id="tab-customers" class="hidden space-y-6">
                <div>
                    <h2 class="text-2xl font-black text-white">顧客・施工管理</h2>
                    <p class="text-sm text-gray-400 mt-1">顧客ごとの施工進捗・日程・現場写真アルバム</p>
                </div>
                <div id="customers-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </section>

        </div>
    </main>

    <!-- Mobile Bottom Nav -->
    <nav class="md:hidden fixed bottom-0 inset-x-0 bg-dark-900/95 backdrop-blur border-t border-dark-700 flex z-30">
        <button id="mob-nav-projects" onclick="switchTab('projects')" class="flex-1 flex flex-col items-center justify-center py-2.5 text-gold-400">
            <span class="text-lg">📋</span><span class="text-[11px] font-bold mt-0.5">案件登録</span>
        </button>
        <button id="mob-nav-materials" onclick="switchTab('materials')" class="flex-1 flex flex-col items-center justify-center py-2.5 text-gray-500">
            <span class="text-lg">🪣</span><span class="text-[11px] font-bold mt-0.5">材料・在庫</span>
        </button>
        <button id="mob-nav-customers" onclick="switchTab('customers')" class="flex-1 flex flex-col items-center justify-center py-2.5 text-gray-500">
            <span class="text-lg">🏠</span><span class="text-[11px] font-bold mt-0.5">顧客・施工</span>
        </button>
    </nav>

    <!-- Photo Fullscreen Modal -->
    <div id="photo-modal" onclick="closePhotoModal()" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
        <img id="modal-img" src="" alt="現場写真" class="max-w-full max-h-[85vh] rounded-xl shadow-2xl">
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-16 right-4 bg-gold-500 text-dark-950 font-black text-xs px-4 py-2.5 rounded-xl shadow-xl transform translate-x-full opacity-0 transition-all duration-300 z-50"></div>

    <script>
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyCHHzV1U9sQnDn67v7yuoGYblF5MajDKMY",
            authDomain: "paint-management-pro.firebaseapp.com",
            projectId: "paint-management-pro",
            storageBucket: "paint-management-pro.firebasestorage.app",
            messagingSenderId: "189178260447",
            appId: "1:189178260447:web:66a7026630262fbd47726a",
            measurementId: "G-CMLSFSBEVL"
        };

        let db = null;
        let currentTab = 'projects';
        let currentGroup = localStorage.getItem('paint_pro_group') || 'hachioji-paint';
        let unsubscribeFirestore = null;
        let appState = { projects: [], materials: [] };

        document.getElementById('group-input').value = currentGroup;

        try {
            if (FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey) {
                firebase.initializeApp(FIREBASE_CONFIG);
                db = firebase.firestore();
            }
        } catch (err) {
            console.warn('Firebase init error:', err);
        }

        function getStorageKey() {
            return `paint_pro_sync_${currentGroup}`;
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.remove('translate-x-full', 'opacity-0');
            setTimeout(() => t.classList.add('translate-x-full', 'opacity-0'), 2500);
        }

        function switchTab(tabId) {
            currentTab = tabId;
            ['projects', 'materials', 'customers'].forEach(t => {
                const sec = document.getElementById(`tab-${t}`);
                const nav = document.getElementById(`nav-${t}`);
                const mob = document.getElementById(`mob-nav-${t}`);
                if (t === tabId) {
                    sec.classList.remove('hidden');
                    if (nav) nav.className = "w-full flex items-center gap-3 px-4 py-3.5 rounded-xl font-bold text-sm transition-all bg-gold-500 text-dark-950 shadow-lg shadow-gold-500/20";
                    if (mob) mob.className = "flex-1 flex flex-col items-center justify-center py-2.5 text-gold-400";
                } else {
                    sec.classList.add('hidden');
                    if (nav) nav.className = "w-full flex items-center gap-3 px-4 py-3.5 rounded-xl font-bold text-sm transition-all text-gray-400 hover:bg-dark-800 hover:text-white";
                    if (mob) mob.className = "flex-1 flex flex-col items-center justify-center py-2.5 text-gray-500";
                }
            });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateSyncStatus(text, isCloud) {
            const el = document.getElementById('sync-status');
            el.innerHTML = `<span class="w-2 h-2 rounded-full ${isCloud ? 'bg-emerald-400' : 'bg-gold-400'} animate-pulse"></span><span>${text}</span>`;
        }

        function loadLocalData() {
            try {
                const saved = localStorage.getItem(getStorageKey());
                if (saved) {
                    const parsed = JSON.parse(saved);
                    appState.projects = Array.isArray(parsed.projects) ? parsed.projects : [];
                    appState.materials = Array.isArray(parsed.materials) ? parsed.materials : [];
                } else {
                    appState = { projects: [], materials: [] };
                }
            } catch (e) {
                appState = { projects: [], materials: [] };
            }
            renderAll();
        }

        async function saveData() {
            localStorage.setItem(getStorageKey(), JSON.stringify(appState));
            renderAll();
            if (db) {
                try {
                    await db.collection('paint_groups').doc(currentGroup).set({
                        projects: appState.projects,
                        materials: appState.materials,
                        updatedAt: Date.now()
                    });
                    updateSyncStatus(`クラウド同期済 (${currentGroup})`, true);
                } catch (err) {
                    console.error('Firestore save error:', err);
                    updateSyncStatus('端末内保存 (通信制限)', false);
                }
            }
        }

        function startSyncListener() {
            loadLocalData();
            if (unsubscribeFirestore) {
                unsubscribeFirestore();
                unsubscribeFirestore = null;
            }
            if (db) {
                updateSyncStatus(`接続中 (${currentGroup})...`, true);
                unsubscribeFirestore = db.collection('paint_groups').doc(currentGroup).onSnapshot(doc => {
                    if (doc.exists) {
                        const data = doc.data();
                        appState.projects = Array.isArray(data.projects) ? data.projects : [];
                        appState.materials = Array.isArray(data.materials) ? data.materials : [];
                        localStorage.setItem(getStorageKey(), JSON.stringify(appState));
                        renderAll();
                    }
                    updateSyncStatus(`クラウド同期中 (${currentGroup})`, true);
                }, err => {
                    console.warn('Firestore listener error:', err);
                    updateSyncStatus('ローカル保存モード', false);
                });
            } else {
                updateSyncStatus('ローカル保存モード', false);
            }
        }

        function changeGroup() {
            const val = document.getElementById('group-input').value.trim();
            if (!val) return showToast('合言葉を入力してください');
            currentGroup = val;
            localStorage.setItem('paint_pro_group', currentGroup);
            startSyncListener();
            showToast(`グループ「${currentGroup}」に切替ました`);
        }

        // Projects Logic
        function addProject(e) {
            e.preventDefault();
            const nameInput = document.getElementById('proj-name');
            const name = nameInput.value.trim();
            if (!name) return;

            const newProj = {
                id: Date.now().toString(),
                name: name,
                address: document.getElementById('proj-address').value.trim(),
                estDate: document.getElementById('proj-est-date').value,
                startDate: document.getElementById('proj-start-date').value,
                endDate: document.getElementById('proj-end-date').value,
                paint: document.getElementById('proj-paint').value.trim(),
                color: document.getElementById('proj-color').value.trim(),
                notes: document.getElementById('proj-notes').value.trim(),
                status: '施工予定',
                photos: []
            };

            appState.projects.unshift(newProj);
            document.getElementById('project-form').reset();
            saveData();
            showToast('案件を登録しました');
        }

        function deleteProject(id) {
            if (!confirm('この案件を削除しますか？')) return;
            appState.projects = appState.projects.filter(p => p.id !== id);
            saveData();
            showToast('案件を削除しました');
        }

        function updateProjectStatus(id, status) {
            const p = appState.projects.find(x => x.id === id);
            if (p) {
                p.status = status;
                saveData();
                showToast(`ステータスを「${status}」に変更しました`);
            }
        }

        function handlePhotoUpload(id, input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxW = 800;
                    const scale = Math.min(1, maxW / img.width);
                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    const compressed = canvas.toDataURL('image/jpeg', 0.7);
                    const p = appState.projects.find(x => x.id === id);
                    if (p) {
                        if (!p.photos) p.photos = [];
                        p.photos.push(compressed);
                        saveData();
                        showToast('現場写真を追加しました');
                    }
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }

        function openPhotoModal(src) {
            document.getElementById('modal-img').src = src;
            document.getElementById('photo-modal').classList.remove('hidden');
        }

        function closePhotoModal() {
            document.getElementById('photo-modal').classList.add('hidden');
        }

        // Materials Logic
        function addMaterial(e) {
            e.preventDefault();
            const name = document.getElementById('mat-name').value.trim();
            const color = document.getElementById('mat-color').value.trim();
            const weight = parseFloat(document.getElementById('mat-weight').value);
            if (!name || isNaN(weight)) return;

            appState.materials.unshift({
                id: Date.now().toString(),
                name,
                color: color || '標準色',
                weight: Math.max(0, Number(weight.toFixed(1)))
            });
            e.target.reset();
            saveData();
            showToast('材料を追加しました');
        }

        function updateMaterialWeight(id, val) {
            const m = appState.materials.find(x => x.id === id);
            const num = parseFloat(val);
            if (m && !isNaN(num)) {
                m.weight = Math.max(0, Number(num.toFixed(1)));
                saveData();
            }
        }

        function adjustWeight(id, delta) {
            const m = appState.materials.find(x => x.id === id);
            if (m) {
                m.weight = Math.max(0, Number((m.weight + delta).toFixed(1)));
                saveData();
            }
        }

        function deleteMaterial(id) {
            if (!confirm('この材料を削除しますか？')) return;
            appState.materials = appState.materials.filter(m => m.id !== id);
            saveData();
            showToast('材料を削除しました');
        }

        async function connectBLE() {
            if (!navigator.bluetooth) {
                return showToast('このブラウザはBluetooth未対応です（手動入力をご利用ください）');
            }
            try {
                const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true });
                document.getElementById('ble-text').textContent = device.name || '接続済';
                showToast('Bluetooth機器と接続しました');
            } catch (e) {
                showToast('Bluetooth接続をキャンセルしました');
            }
        }

        function exportCSV() {
            if (appState.materials.length === 0) return showToast('出力する在庫データがありません');
            let csv = '\uFEFF材料名,色番号,残量(kg)\n';
            appState.materials.forEach(m => {
                csv += `"${m.name}","${m.color}",${m.weight}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `在庫一覧_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
            showToast('CSVをダウンロードしました');
        }

        function copyInventoryList() {
            if (appState.materials.length === 0) return showToast('コピーする在庫データがありません');
            const lines = ['【塗料在庫一覧】'];
            appState.materials.forEach(m => {
                lines.push(`・${m.name}（${m.color}）：${m.weight} kg`);
            });
            navigator.clipboard.writeText(lines.join('\n')).then(() => {
                showToast('在庫リストをクリップボードにコピーしました');
            });
        }

        function renderAll() {
            // Render Projects Tab
            const pList = document.getElementById('projects-list');
            if (appState.projects.length === 0) {
                pList.innerHTML = '<div class="col-span-full text-center py-8 text-gray-500 text-sm bg-dark-900/50 rounded-2xl border border-dark-800">登録された案件はまだありません</div>';
            } else {
                pList.innerHTML = appState.projects.map(p => `
                    <div class="bg-dark-900 border border-dark-700 rounded-2xl p-4 space-y-2.5">
                        <div class="flex items-start justify-between gap-2">
                            <div>
                                <span class="inline-block text-[11px] font-bold px-2 py-0.5 rounded bg-gold-500/20 text-gold-400 mb-1">${p.status || '施工予定'}</span>
                                <h4 class="font-black text-white text-base">${p.name}</h4>
                                ${p.address ? `<p class="text-xs text-gray-400">📍 ${p.address}</p>` : ''}
                            </div>
                            <button onclick="deleteProject('${p.id}')" class="text-gray-500 hover:text-red-400 text-xs px-2 py-1">削除</button>
                        </div>
                        <div class="text-xs text-gray-300 bg-dark-800/80 rounded-xl p-2.5 space-y-1">
                            <div>🎨 塗料: <span class="text-white font-semibold">${p.paint || '未設定'}</span> / 色: <span class="text-gold-400 font-bold">${p.color || '未設定'}</span></div>
                            <div>📅 見積: ${p.estDate || '-'} ｜ 着工: ${p.startDate || '-'} ｜ 完工: ${p.endDate || '-'}</div>
                        </div>
                    </div>
                `).join('');
            }

            // Render Materials Tab
            const mList = document.getElementById('materials-list');
            if (appState.materials.length === 0) {
                mList.innerHTML = '<div class="col-span-full text-center py-8 text-gray-500 text-sm bg-dark-900/50 rounded-2xl border border-dark-800">登録された材料はありません</div>';
            } else {
                mList.innerHTML = appState.materials.map(m => `
                    <div class="bg-dark-900 border border-dark-700 rounded-2xl p-4 flex flex-col justify-between gap-3">
                        <div class="flex items-start justify-between">
                            <div>
                                <h4 class="font-black text-white text-base">${m.name}</h4>
                                <span class="inline-block mt-1 text-xs font-bold text-gold-400 bg-dark-800 px-2.5 py-0.5 rounded-md border border-dark-700">色: ${m.color}</span>
                            </div>
                            <button onclick="deleteMaterial('${m.id}')" class="text-gray-500 hover:text-red-400 text-xs">削除</button>
                        </div>
                        <div class="flex items-center justify-between gap-2 bg-dark-800 p-2.5 rounded-xl">
                            <button onclick="adjustWeight('${m.id}', -0.5)" class="w-9 h-9 rounded-lg bg-dark-700 hover:bg-dark-600 text-white font-black">-0.5</button>
                            <div class="flex items-baseline gap-1">
                                <input type="number" step="0.1" value="${m.weight}" onchange="updateMaterialWeight('${m.id}', this.value)" class="w-20 bg-dark-950 border border-dark-700 rounded-lg px-2 py-1 text-center text-lg font-black text-gold-400">
                                <span class="text-xs font-bold text-gray-400">kg</span>
                            </div>
                            <button onclick="adjustWeight('${m.id}', 0.5)" class="w-9 h-9 rounded-lg bg-dark-700 hover:bg-dark-600 text-white font-black">+0.5</button>
                        </div>
                    </div>
                `).join('');
            }

            // Render Customers Tab
            const cGrid = document.getElementById('customers-grid');
            if (appState.projects.length === 0) {
                cGrid.innerHTML = '<div class="col-span-full text-center py-8 text-gray-500 text-sm bg-dark-900/50 rounded-2xl border border-dark-800">「案件登録」タブから案件を追加するとここに表示されます</div>';
            } else {
                cGrid.innerHTML = appState.projects.map(p => `
                    <div class="bg-dark-900 border border-dark-700 rounded-2xl p-4 space-y-3">
                        <div class="flex items-center justify-between gap-2">
                            <h4 class="font-black text-white text-base">${p.name}</h4>
                            <select onchange="updateProjectStatus('${p.id}', this.value)" class="bg-dark-800 border border-dark-700 rounded-lg px-2.5 py-1 text-xs font-bold text-gold-400">
                                <option value="見積中" ${p.status==='見積中'?'selected':''}>見積中</option>
                                <option value="施工予定" ${p.status==='施工予定'?'selected':''}>施工予定</option>
                                <option value="施工中" ${p.status==='施工中'?'selected':''}>施工中</option>
                                <option value="完工済" ${p.status==='完工済'?'selected':''}>完工済</option>
                            </select>
                        </div>
                        <div class="text-xs text-gray-300 space-y-1">
                            <p>📍 ${p.address || '住所未登録'}</p>
                            <p>🎨 ${p.paint || '-'}（${p.color || '-'}）</p>
                            <p>📅 着工: ${p.startDate || '-'} 〜 完工: ${p.endDate || '-'}</p>
                            ${p.notes ? `<p class="text-gray-400 bg-dark-800 p-2 rounded-lg mt-1">${p.notes}</p>` : ''}
                        </div>
                        <div class="pt-2 border-t border-dark-800">
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-xs font-bold text-gray-400">現場写真アルバム (${(p.photos||[]).length}枚)</span>
                                <label class="cursor-pointer bg-dark-800 hover:bg-dark-700 text-gold-400 text-xs font-bold px-2.5 py-1 rounded-lg border border-dark-700">
                                    📷 写真追加
                                    <input type="file" accept="image/*" class="hidden" onchange="handlePhotoUpload('${p.id}', this)">
                                </label>
                            </div>
                            <div class="flex gap-2 overflow-x-auto no-scrollbar">
                                ${(p.photos||[]).map(src => `<img src="${src}" onclick="openPhotoModal('${src}')" class="w-16 h-16 object-cover rounded-lg border border-dark-700 cursor-pointer flex-shrink-0">`).join('')}
                            </div>
                        </div>
                    </div>
                `).join('');
            }
        }

        startSyncListener();
    </script>
</body>
</html>

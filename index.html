<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paint Management Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
                    },
                    colors: {
                        dark: {
                            950: '#070709',
                            900: '#0f1014',
                            850: '#15171e',
                            800: '#1c1f28',
                            700: '#282c38',
                            600: '#373d4e'
                        },
                        gold: {
                            300: '#fcd34d',
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706',
                            700: '#b45309'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <style>
        body {
            background-color: #070709;
            color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.85) sepia(1) saturate(3) hue-rotate(5deg);
            cursor: pointer;
        }
        .glass-panel {
            background: rgba(15, 16, 20, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .gold-glow {
            box-shadow: 0 0 25px -5px rgba(245, 158, 11, 0.25);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row pb-24 md:pb-0 selection:bg-gold-500 selection:text-dark-950">

    <!-- Desktop Sidebar -->
    <aside class="hidden md:flex md:w-72 md:flex-col md:fixed md:inset-y-0 bg-dark-900 border-r border-dark-700/80 z-30">
        <div class="p-6 border-b border-dark-700/80">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-gold-400 via-gold-500 to-gold-700 flex items-center justify-center text-dark-950 shadow-lg gold-glow flex-shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01" />
                    </svg>
                </div>
                <div>
                    <h1 class="font-black text-white tracking-tight text-base leading-tight">Paint Management Pro</h1>
                    <span class="text-[10px] font-bold tracking-wider text-gold-400 block mt-0.5">現場・在庫・施工管理システム</span>
                </div>
            </div>
        </div>

        <nav class="flex-1 p-5 space-y-2.5">
            <button id="nav-projects" onclick="switchTab('projects')" class="w-full flex items-center gap-3.5 px-4 py-3.5 rounded-xl font-bold text-sm transition-all bg-gradient-to-r from-gold-500 to-gold-600 text-dark-950 shadow-lg shadow-gold-500/20">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                <span>案件登録</span>
            </button>

            <button id="nav-materials" onclick="switchTab('materials')" class="w-full flex items-center gap-3.5 px-4 py-3.5 rounded-xl font-bold text-sm transition-all text-gray-400 hover:bg-dark-800 hover:text-white">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                </svg>
                <span>材料・在庫管理</span>
            </button>

            <button id="nav-customers" onclick="switchTab('customers')" class="w-full flex items-center gap-3.5 px-4 py-3.5 rounded-xl font-bold text-sm transition-all text-gray-400 hover:bg-dark-800 hover:text-white">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                <span>顧客・施工管理</span>
            </button>
        </nav>

        <div class="p-5 border-t border-dark-700/80">
            <div class="bg-dark-850 rounded-xl p-3.5 border border-dark-700/80">
                <div class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1">Active Workspace</div>
                <div id="sidebar-group-label" class="text-xs font-bold text-gold-400 truncate">hachioji-paint</div>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 md:pl-72">
        <!-- Top Sync Header -->
        <header class="sticky top-0 z-20 glass-panel border-b border-dark-700/80 px-4 md:px-8 py-3">
            <div class="max-w-6xl mx-auto space-y-2.5">
                <!-- Mobile App Title Row -->
                <div class="flex md:hidden items-center justify-between">
                    <div class="flex items-center gap-2.5">
                        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-gold-400 via-gold-500 to-gold-700 text-dark-950 flex items-center justify-center shadow gold-glow">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01" />
                            </svg>
                        </div>
                        <span class="font-black text-white text-base tracking-tight">Paint Management Pro</span>
                    </div>
                    <div id="sync-status-mob" class="text-[11px] font-bold text-emerald-400 bg-dark-850 border border-dark-700 px-2.5 py-1 rounded-full flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span>同期待機</span>
                    </div>
                </div>

                <!-- Group Sync Bar -->
                <div class="flex items-center justify-between gap-3">
                    <div class="flex items-center bg-dark-850 border border-dark-700 rounded-xl p-1 w-full md:w-auto">
                        <span class="text-[11px] font-bold text-gray-400 px-2.5 whitespace-nowrap">GROUP KEY</span>
                        <input id="group-input" type="text" value="hachioji-paint" placeholder="合言葉" class="bg-dark-950 border border-dark-700 rounded-lg px-2.5 py-1 text-xs text-white font-bold flex-1 md:w-40 focus:outline-none focus:border-gold-500">
                        <button onclick="changeGroup()" class="ml-1 bg-gold-500 hover:bg-gold-400 text-dark-950 font-extrabold text-xs px-3 py-1 rounded-lg transition whitespace-nowrap">同期</button>
                    </div>
                    <div id="sync-status" class="hidden md:flex text-xs font-bold text-emerald-400 bg-dark-850 border border-dark-700 px-3 py-1.5 rounded-full items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span>クラウド接続待機</span>
                    </div>
                </div>
            </div>
        </header>

        <div class="max-w-6xl mx-auto p-4 md:p-8 space-y-8">

            <!-- TAB 1: 案件登録 -->
            <section id="tab-projects" class="space-y-6">
                <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-2 border-b border-dark-700/80 pb-4">
                    <div>
                        <span class="text-xs font-extrabold tracking-widest text-gold-400 uppercase">Project Registration</span>
                        <h2 class="text-2xl md:text-3xl font-black text-white tracking-tight mt-0.5">案件登録</h2>
                    </div>
                    <p class="text-xs text-gray-400">新規現場の顧客情報・工程日程・使用塗料・現場写真を登録</p>
                </div>

                <form id="project-form" onsubmit="addProject(event)" class="bg-dark-900 border border-dark-700/90 rounded-2xl p-5 md:p-7 space-y-5 shadow-2xl">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1.5">顧客名・現場名称 <span class="text-gold-400">*</span></label>
                            <input id="proj-name" type="text" required placeholder="例：山田様邸 外壁・屋根塗装工事" class="w-full bg-dark-950 border border-dark-700 rounded-xl px-4 py-3 text-white text-sm font-medium focus:outline-none focus:border-gold-500 transition">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1.5">施工住所・エリア</label>
                            <input id="proj-address" type="text" placeholder="例：東京都八王子市下恩方町" class="w-full bg-dark-950 border border-dark-700 rounded-xl px-4 py-3 text-white text-sm font-medium focus:outline-none focus:border-gold-500 transition">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-dark-850/70 p-4 rounded-xl border border-dark-700/70">
                        <div>
                            <label class="block text-xs font-bold text-gray-400 mb-1.5">見積提出日</label>
                            <input id="proj-est-date" type="date" class="w-full bg-dark-950 border border-dark-700 rounded-xl px-3.5 py-2.5 text-white text-sm font-medium focus:outline-none focus:border-gold-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-400 mb-1.5">着工予定日</label>
                            <input id="proj-start-date" type="date" class="w-full bg-dark-950 border border-dark-700 rounded-xl px-3.5 py-2.5 text-white text-sm font-medium focus:outline-none focus:border-gold-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-400 mb-1.5">完工予定日</label>
                            <input id="proj-end-date" type="date" class="w-full bg-dark-950 border border-dark-700 rounded-xl px-3.5 py-2.5 text-white text-sm font-medium focus:outline-none focus:border-gold-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1.5">使用塗料・メーカー仕様</label>
                            <input id="proj-paint" type="text" placeholder="例：日本ペイント パーフェクトトップ" class="w-full bg-dark-950 border border-dark-700 rounded-xl px-4 py-3 text-white text-sm font-medium focus:outline-none focus:border-gold-500 transition">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1.5">指定色番号・カラー（自由記述）</label>
                            <input id="proj-color" type="text" placeholder="例：ND-105 / 22-90B 艶消し" class="w-full bg-dark-950 border border-dark-700 rounded-xl px-4 py-3 text-white text-sm font-medium focus:outline-none focus:border-gold-500 transition">
                        </div>
                    </div>

                    <!-- 現場写真登録エリア -->
                    <div class="bg-dark-850/70 border border-dark-700/80 rounded-xl p-4 space-y-3">
                        <div class="flex items-center justify-between">
                            <div>
                                <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider">現場写真の添付（現地調査・施工前など）</label>
                                <span class="text-[11px] text-gray-500">複数枚選択可能（登録後、現場アルバムへ自動反映）</span>
                            </div>
                            <label class="cursor-pointer bg-dark-800 hover:bg-dark-700 text-gold-400 border border-gold-500/40 font-bold text-xs px-3.5 py-2 rounded-xl transition flex items-center gap-1.5">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                                <span>写真を選択</span>
                                <input id="proj-photos-input" type="file" accept="image/*" multiple class="hidden" onchange="handleNewProjectPhotos(this)">
                            </label>
                        </div>
                        <div id="new-proj-photo-preview" class="flex gap-2.5 overflow-x-auto no-scrollbar empty:hidden pt-1"></div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1.5">現場メモ・特記事項</label>
                        <textarea id="proj-notes" rows="2" placeholder="足場架設日、付帯部カラー、近隣挨拶・鍵保管場所など" class="w-full bg-dark-950 border border-dark-700 rounded-xl px-4 py-3 text-white text-sm font-medium focus:outline-none focus:border-gold-500 transition"></textarea>
                    </div>

                    <div class="pt-1">
                        <button type="submit" class="w-full bg-gradient-to-r from-gold-400 via-gold-500 to-gold-600 hover:from-gold-300 hover:to-gold-500 text-dark-950 font-black py-3.5 rounded-xl shadow-lg shadow-gold-500/20 transition text-sm tracking-wide uppercase">
                            案件を登録する
                        </button>
                    </div>
                </form>

                <!-- Registered Projects Summary -->
                <div class="space-y-3 pt-2">
                    <div class="flex items-center justify-between">
                        <h3 class="text-sm font-extrabold uppercase tracking-wider text-gray-400">登録済み案件一覧</h3>
                        <span id="project-count-badge" class="text-xs font-bold text-gold-400 bg-dark-850 border border-dark-700 px-2.5 py-0.5 rounded-full">0 件</span>
                    </div>
                    <div id="projects-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                </div>
            </section>

            <!-- TAB 2: 材料・在庫管理 -->
            <section id="tab-materials" class="hidden space-y-6">
                <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-4 border-b border-dark-700/80 pb-4">
                    <div>
                        <span class="text-xs font-extrabold tracking-widest text-gold-400 uppercase">Inventory &amp; Scale</span>
                        <h2 class="text-2xl md:text-3xl font-black text-white tracking-tight mt-0.5">材料・在庫管理</h2>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="connectBLE()" id="ble-btn" class="bg-dark-850 hover:bg-dark-800 border border-gold-500/50 text-gold-400 font-bold text-xs px-3.5 py-2.5 rounded-xl transition flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0" />
                            </svg>
                            <span id="ble-text">BLEデジタルはかり接続</span>
                        </button>
                        <button onclick="exportCSV()" class="bg-dark-850 hover:bg-dark-800 border border-dark-700 text-gray-200 font-bold text-xs px-3.5 py-2.5 rounded-xl transition flex items-center gap-1.5">
                            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                            </svg>
                            <span>CSV出力</span>
                        </button>
                        <button onclick="copyInventoryList()" class="bg-gold-500 hover:bg-gold-400 text-dark-950 font-extrabold text-xs px-3.5 py-2.5 rounded-xl transition flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                            </svg>
                            <span>リストコピー</span>
                        </button>
                    </div>
                </div>

                <!-- Add Material Form -->
                <form onsubmit="addMaterial(event)" class="bg-dark-900 border border-dark-700/90 rounded-2xl p-4 md:p-5 grid grid-cols-1 sm:grid-cols-12 gap-3 shadow-xl">
                    <div class="sm:col-span-5">
                        <input id="mat-name" type="text" required placeholder="塗料・材料名（例：ファインSi）" class="w-full bg-dark-950 border border-dark-700 rounded-xl px-4 py-3 text-white text-sm font-medium focus:outline-none focus:border-gold-500">
                    </div>
                    <div class="sm:col-span-3">
                        <input id="mat-color" type="text" placeholder="色番号（例：N-90）" class="w-full bg-dark-950 border border-dark-700 rounded-xl px-4 py-3 text-white text-sm font-medium focus:outline-none focus:border-gold-500">
                    </div>
                    <div class="sm:col-span-2">
                        <input id="mat-weight" type="number" step="0.1" required placeholder="残量 (kg)" class="w-full bg-dark-950 border border-dark-700 rounded-xl px-3.5 py-3 text-white text-sm font-bold focus:outline-none focus:border-gold-500">
                    </div>
                    <div class="sm:col-span-2">
                        <button type="submit" class="w-full h-full bg-gradient-to-r from-gold-400 to-gold-600 hover:from-gold-300 hover:to-gold-500 text-dark-950 font-black rounded-xl py-3 text-sm transition">
                            追加
                        </button>
                    </div>
                </form>

                <!-- Materials Cards Grid -->
                <div id="materials-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </section>

            <!-- TAB 3: 顧客・施工管理 -->
            <section id="tab-customers" class="hidden space-y-6">
                <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-2 border-b border-dark-700/80 pb-4">
                    <div>
                        <span class="text-xs font-extrabold tracking-widest text-gold-400 uppercase">Client &amp; Construction</span>
                        <h2 class="text-2xl md:text-3xl font-black text-white tracking-tight mt-0.5">顧客・施工管理</h2>
                    </div>
                    <p class="text-xs text-gray-400">施工ステータス更新・工程日程・現場写真アルバム管理</p>
                </div>

                <div id="customers-grid" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
            </section>

        </div>
    </main>

    <!-- Mobile Bottom Navigation -->
    <nav class="md:hidden fixed bottom-0 inset-x-0 glass-panel border-t border-dark-700/90 flex z-30">
        <button id="mob-nav-projects" onclick="switchTab('projects')" class="flex-1 flex flex-col items-center justify-center py-2.5 text-gold-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <span class="text-[11px] font-bold mt-1">案件登録</span>
        </button>
        <button id="mob-nav-materials" onclick="switchTab('materials')" class="flex-1 flex flex-col items-center justify-center py-2.5 text-gray-500">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
            </svg>
            <span class="text-[11px] font-bold mt-1">材料・在庫管理</span>
        </button>
        <button id="mob-nav-customers" onclick="switchTab('customers')" class="flex-1 flex flex-col items-center justify-center py-2.5 text-gray-500">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
            <span class="text-[11px] font-bold mt-1">顧客・施工管理</span>
        </button>
    </nav>

    <!-- Fullscreen Photo Preview Modal -->
    <div id="photo-modal" onclick="closePhotoModal()" class="hidden fixed inset-0 bg-black/95 z-50 flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-4xl flex justify-end mb-3">
            <button onclick="closePhotoModal()" class="text-white/80 hover:text-white bg-dark-800 border border-dark-700 rounded-full px-4 py-1.5 text-xs font-bold">閉じる</button>
        </div>
        <img id="modal-img" src="" alt="現場写真" class="max-w-full max-h-[80vh] rounded-xl border border-dark-700 shadow-2xl">
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-24 md:top-16 right-4 bg-dark-850 border border-gold-500/60 text-gold-400 font-bold text-xs px-4 py-3 rounded-xl shadow-2xl transform translate-x-full opacity-0 transition-all duration-300 z-50"></div>

    <script>
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyCHHzV1U9sQnDn67v7yuoGYblF5MajDKMY",
            authDomain: "paint-management-pro.firebaseapp.com",
            projectId: "paint-management-pro",
            storageBucket: "paint-management-pro.firebasestorage.app",
            messagingSenderId: "189178260447",
            appId: "1:189178260447:web:66a7026630262fbd47726a",
            measurementId: "G-CMLSFSBEVL"
        };

        let db = null;
        let currentTab = 'projects';
        let currentGroup = localStorage.getItem('paint_pro_group') || 'hachioji-paint';
        let unsubscribeFirestore = null;
        let appState = { projects: [], materials: [] };
        let pendingProjectPhotos = [];

        document.getElementById('group-input').value = currentGroup;
        document.getElementById('sidebar-group-label').textContent = currentGroup;

        try {
            if (FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey) {
                firebase.initializeApp(FIREBASE_CONFIG);
                db = firebase.firestore();
            }
        } catch (err) {
            console.warn('Firebase init error:', err);
        }

        function getStorageKey() {
            return `paint_pro_sync_${currentGroup}`;
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.remove('translate-x-full', 'opacity-0');
            setTimeout(() => t.classList.add('translate-x-full', 'opacity-0'), 2600);
        }

        function switchTab(tabId) {
            currentTab = tabId;
            ['projects', 'materials', 'customers'].forEach(t => {
                const sec = document.getElementById(`tab-${t}`);
                const nav = document.getElementById(`nav-${t}`);
                const mob = document.getElementById(`mob-nav-${t}`);
                if (t === tabId) {
                    sec.classList.remove('hidden');
                    if (nav) nav.className = "w-full flex items-center gap-3.5 px-4 py-3.5 rounded-xl font-bold text-sm transition-all bg-gradient-to-r from-gold-500 to-gold-600 text-dark-950 shadow-lg shadow-gold-500/20";
                    if (mob) mob.className = "flex-1 flex flex-col items-center justify-center py-2.5 text-gold-400";
                } else {
                    sec.classList.add('hidden');
                    if (nav) nav.className = "w-full flex items-center gap-3.5 px-4 py-3.5 rounded-xl font-bold text-sm transition-all text-gray-400 hover:bg-dark-800 hover:text-white";
                    if (mob) mob.className = "flex-1 flex flex-col items-center justify-center py-2.5 text-gray-500";
                }
            });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateSyncStatus(text, isCloud) {
            const html = `<span class="w-2 h-2 rounded-full ${isCloud ? 'bg-emerald-400' : 'bg-gold-400'} animate-pulse"></span><span>${text}</span>`;
            const el = document.getElementById('sync-status');
            const mobEl = document.getElementById('sync-status-mob');
            if (el) el.innerHTML = html;
            if (mobEl) mobEl.innerHTML = `<span class="w-1.5 h-1.5 rounded-full ${isCloud ? 'bg-emerald-400' : 'bg-gold-400'} animate-pulse"></span><span>${isCloud ? '同期中' : '端末保存'}</span>`;
        }

        function loadLocalData() {
            try {
                const saved = localStorage.getItem(getStorageKey());
                if (saved) {
                    const parsed = JSON.parse(saved);
                    appState.projects = Array.isArray(parsed.projects) ? parsed.projects : [];
                    appState.materials = Array.isArray(parsed.materials) ? parsed.materials : [];
                } else {
                    appState = { projects: [], materials: [] };
                }
            } catch (e) {
                appState = { projects: [], materials: [] };
            }
            renderAll();
        }

        async function saveData() {
            localStorage.setItem(getStorageKey(), JSON.stringify(appState));
            renderAll();
            if (db) {
                try {
                    await db.collection('paint_groups').doc(currentGroup).set({
                        projects: appState.projects,
                        materials: appState.materials,
                        updatedAt: Date.now()
                    });
                    updateSyncStatus(`同期完了 (${currentGroup})`, true);
                } catch (err) {
                    console.error('Firestore save error:', err);
                    updateSyncStatus('端末保存モード', false);
                }
            }
        }

        function startSyncListener() {
            loadLocalData();
            if (unsubscribeFirestore) {
                unsubscribeFirestore();
                unsubscribeFirestore = null;
            }
            if (db) {
                updateSyncStatus(`接続中 (${currentGroup})...`, true);
                unsubscribeFirestore = db.collection('paint_groups').doc(currentGroup).onSnapshot(doc => {
                    if (doc.exists) {
                        const data = doc.data();
                        appState.projects = Array.isArray(data.projects) ? data.projects : [];
                        appState.materials = Array.isArray(data.materials) ? data.materials : [];
                        localStorage.setItem(getStorageKey(), JSON.stringify(appState));
                        renderAll();
                    }
                    updateSyncStatus(`リアルタイム同期中 (${currentGroup})`, true);
                }, err => {
                    console.warn('Firestore listener error:', err);
                    updateSyncStatus('ローカル保存モード', false);
                });
            } else {
                updateSyncStatus('ローカル保存モード', false);
            }
        }

        function changeGroup() {
            const val = document.getElementById('group-input').value.trim();
            if (!val) return showToast('グループ合言葉を入力してください');
            currentGroup = val;
            localStorage.setItem('paint_pro_group', currentGroup);
            document.getElementById('sidebar-group-label').textContent = currentGroup;
            startSyncListener();
            showToast(`グループ「${currentGroup}」へ切り替えました`);
        }

        // New Project Photo Selection & Compression
        function compressImageFile(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const maxW = 800;
                        const scale = Math.min(1, maxW / img.width);
                        canvas.width = img.width * scale;
                        canvas.height = img.height * scale;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.72));
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function handleNewProjectPhotos(input) {
            const files = Array.from(input.files || []);
            if (!files.length) return;
            for (const file of files) {
                const compressed = await compressImageFile(file);
                pendingProjectPhotos.push(compressed);
            }
            input.value = '';
            renderNewProjectPhotoPreviews();
            showToast(`${files.length}枚の写真を添付しました`);
        }

        function removePendingPhoto(idx) {
            pendingProjectPhotos.splice(idx, 1);
            renderNewProjectPhotoPreviews();
        }

        function renderNewProjectPhotoPreviews() {
            const box = document.getElementById('new-proj-photo-preview');
            box.innerHTML = pendingProjectPhotos.map((src, idx) => `
                <div class="relative flex-shrink-0 group">
                    <img src="${src}" onclick="openPhotoModal('${src}')" class="w-20 h-20 object-cover rounded-xl border border-dark-700 cursor-pointer">
                    <button type="button" onclick="removePendingPhoto(${idx})" class="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-red-600 text-white text-[10px] font-black flex items-center justify-center shadow">×</button>
                </div>
            `).join('');
        }

        // Projects Logic
        function addProject(e) {
            e.preventDefault();
            const name = document.getElementById('proj-name').value.trim();
            if (!name) return;

            const newProj = {
                id: Date.now().toString(),
                name: name,
                address: document.getElementById('proj-address').value.trim(),
                estDate: document.getElementById('proj-est-date').value,
                startDate: document.getElementById('proj-start-date').value,
                endDate: document.getElementById('proj-end-date').value,
                paint: document.getElementById('proj-paint').value.trim(),
                color: document.getElementById('proj-color').value.trim(),
                notes: document.getElementById('proj-notes').value.trim(),
                status: '施工予定',
                photos: [...pendingProjectPhotos]
            };

            appState.projects.unshift(newProj);
            pendingProjectPhotos = [];
            renderNewProjectPhotoPreviews();
            document.getElementById('project-form').reset();
            saveData();
            showToast('新規案件を登録しました');
        }

        function deleteProject(id) {
            if (!confirm('この案件を削除してもよろしいですか？')) return;
            appState.projects = appState.projects.filter(p => p.id !== id);
            saveData();
            showToast('案件を削除しました');
        }

        function updateProjectStatus(id, status) {
            const p = appState.projects.find(x => x.id === id);
            if (p) {
                p.status = status;
                saveData();
                showToast(`ステータスを「${status}」へ更新しました`);
            }
        }

        async function handlePhotoUpload(id, input) {
            const files = Array.from(input.files || []);
            if (!files.length) return;
            const p = appState.projects.find(x => x.id === id);
            if (!p) return;
            if (!p.photos) p.photos = [];
            for (const file of files) {
                const compressed = await compressImageFile(file);
                p.photos.push(compressed);
            }
            input.value = '';
            saveData();
            showToast('現場写真をアルバムに追加しました');
        }

        function openPhotoModal(src) {
            document.getElementById('modal-img').src = src;
            document.getElementById('photo-modal').classList.remove('hidden');
        }

        function closePhotoModal() {
            document.getElementById('photo-modal').classList.add('hidden');
        }

        // Materials Logic
        function addMaterial(e) {
            e.preventDefault();
            const name = document.getElementById('mat-name').value.trim();
            const color = document.getElementById('mat-color').value.trim();
            const weight = parseFloat(document.getElementById('mat-weight').value);
            if (!name || isNaN(weight)) return;

            appState.materials.unshift({
                id: Date.now().toString(),
                name,
                color: color || '標準色',
                weight: Math.max(0, Number(weight.toFixed(1)))
            });
            e.target.reset();
            saveData();
            showToast('在庫材料を追加しました');
        }

        function updateMaterialWeight(id, val) {
            const m = appState.materials.find(x => x.id === id);
            const num = parseFloat(val);
            if (m && !isNaN(num)) {
                m.weight = Math.max(0, Number(num.toFixed(1)));
                saveData();
            }
        }

        function adjustWeight(id, delta) {
            const m = appState.materials.find(x => x.id === id);
            if (m) {
                m.weight = Math.max(0, Number((m.weight + delta).toFixed(1)));
                saveData();
            }
        }

        function simulateScale(id) {
            const m = appState.materials.find(x => x.id === id);
            if (m) {
                const simulated = Number((Math.random() * 14 + 1).toFixed(1));
                m.weight = simulated;
                saveData();
                showToast(`計測値を反映しました: ${simulated} kg`);
            }
        }

        function deleteMaterial(id) {
            if (!confirm('この材料を在庫一覧から削除しますか？')) return;
            appState.materials = appState.materials.filter(m => m.id !== id);
            saveData();
            showToast('材料を削除しました');
        }

        async function connectBLE() {
            if (!navigator.bluetooth) {
                return showToast('このブラウザはWeb Bluetooth非対応です');
            }
            try {
                const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true });
                document.getElementById('ble-text').textContent = device.name || 'スケール接続済';
                showToast('BLEデジタルスケールと接続しました');
            } catch (e) {
                showToast('Bluetooth接続をキャンセルしました');
            }
        }

        function exportCSV() {
            if (appState.materials.length === 0) return showToast('出力する在庫データがありません');
            let csv = '\uFEFF材料名,色番号,残量(kg)\n';
            appState.materials.forEach(m => {
                csv += `"${m.name}","${m.color}",${m.weight}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `在庫一覧_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
            showToast('CSVファイルを出力しました');
        }

        function copyInventoryList() {
            if (appState.materials.length === 0) return showToast('コピーする在庫データがありません');
            const lines = ['【Paint Management Pro 在庫一覧】'];
            appState.materials.forEach(m => {
                lines.push(`・${m.name} [${m.color}] : ${m.weight} kg`);
            });
            navigator.clipboard.writeText(lines.join('\n')).then(() => {
                showToast('在庫リストをクリップボードにコピーしました');
            });
        }

        function getStatusBadgeClass(status) {
            if (status === '施工中') return 'bg-gold-500/20 text-gold-400 border-gold-500/40';
            if (status === '完工済') return 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40';
            if (status === '見積中') return 'bg-sky-500/20 text-sky-400 border-sky-500/40';
            return 'bg-dark-800 text-gray-300 border-dark-600';
        }

        function renderAll() {
            document.getElementById('project-count-badge').textContent = `${appState.projects.length} 件`;

            // Render Projects Tab
            const pList = document.getElementById('projects-list');
            if (appState.projects.length === 0) {
                pList.innerHTML = '<div class="col-span-full text-center py-10 text-gray-500 text-xs font-bold uppercase tracking-wider bg-dark-900/60 rounded-2xl border border-dark-800">No Registered Projects</div>';
            } else {
                pList.innerHTML = appState.projects.map(p => `
                    <div class="bg-dark-900 border border-dark-700/90 hover:border-gold-500/40 rounded-2xl p-5 space-y-3 transition shadow-lg">
                        <div class="flex items-start justify-between gap-3">
                            <div>
                                <span class="inline-block text-[11px] font-bold px-2.5 py-0.5 rounded-md border ${getStatusBadgeClass(p.status)} mb-1.5">${p.status || '施工予定'}</span>
                                <h4 class="font-black text-white text-base tracking-tight">${p.name}</h4>
                                ${p.address ? `<p class="text-xs text-gray-400 mt-0.5">${p.address}</p>` : ''}
                            </div>
                            <button onclick="deleteProject('${p.id}')" class="text-gray-500 hover:text-red-400 text-xs font-bold px-2 py-1 rounded transition">削除</button>
                        </div>
                        <div class="text-xs text-gray-300 bg-dark-950/90 border border-dark-800 rounded-xl p-3 space-y-1.5">
                            <div class="flex justify-between">
                                <span class="text-gray-500">使用塗料</span>
                                <span class="text-white font-bold">${p.paint || '未指定'}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-gray-500">指定カラー</span>
                                <span class="text-gold-400 font-extrabold">${p.color || '未指定'}</span>
                            </div>
                            <div class="pt-1.5 border-t border-dark-800 flex flex-wrap gap-x-4 gap-y-1 text-[11px] text-gray-400">
                                <span>見積: <strong class="text-gray-200">${p.estDate || '-'}</strong></span>
                                <span>着工: <strong class="text-gray-200">${p.startDate || '-'}</strong></span>
                                <span>完工: <strong class="text-gray-200">${p.endDate || '-'}</strong></span>
                            </div>
                        </div>
                        ${(p.photos && p.photos.length > 0) ? `
                            <div class="flex gap-2 overflow-x-auto no-scrollbar pt-1">
                                ${p.photos.map(src => `<img src="${src}" onclick="openPhotoModal('${src}')" class="w-14 h-14 object-cover rounded-lg border border-dark-700 hover:border-gold-400 cursor-pointer flex-shrink-0">`).join('')}
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            }

            // Render Materials Tab
            const mList = document.getElementById('materials-list');
            if (appState.materials.length === 0) {
                mList.innerHTML = '<div class="col-span-full text-center py-10 text-gray-500 text-xs font-bold uppercase tracking-wider bg-dark-900/60 rounded-2xl border border-dark-800">No Inventory Items</div>';
            } else {
                mList.innerHTML = appState.materials.map(m => {
                    const pct = Math.min(100, Math.round((m.weight / 16) * 100));
                    return `
                    <div class="bg-dark-900 border border-dark-700/90 hover:border-gold-500/40 rounded-2xl p-5 flex flex-col justify-between gap-4 transition shadow-lg">
                        <div class="flex items-start justify-between gap-2">
                            <div>
                                <h4 class="font-black text-white text-base tracking-tight">${m.name}</h4>
                                <span class="inline-block mt-1.5 text-[11px] font-extrabold text-gold-400 bg-dark-950 px-2.5 py-0.5 rounded-md border border-dark-700">COLOR: ${m.color}</span>
                            </div>
                            <button onclick="deleteMaterial('${m.id}')" class="text-gray-500 hover:text-red-400 text-xs font-bold">削除</button>
                        </div>

                        <div class="space-y-2">
                            <div class="w-full h-1.5 bg-dark-950 rounded-full overflow-hidden border border-dark-800">
                                <div class="h-full bg-gradient-to-r from-gold-600 to-gold-400 transition-all duration-300" style="width: ${pct}%"></div>
                            </div>

                            <div class="flex items-center justify-between gap-2 bg-dark-950 border border-dark-800 p-2.5 rounded-xl">
                                <button onclick="adjustWeight('${m.id}', -0.5)" class="w-9 h-9 rounded-lg bg-dark-800 hover:bg-dark-700 text-gray-200 font-black text-xs transition">-0.5</button>
                                <div class="flex items-baseline gap-1">
                                    <input type="number" step="0.1" value="${m.weight}" onchange="updateMaterialWeight('${m.id}', this.value)" class="w-20 bg-dark-900 border border-dark-700 rounded-lg px-2 py-1 text-center text-xl font-black text-gold-400 focus:outline-none focus:border-gold-500">
                                    <span class="text-xs font-extrabold text-gray-500">KG</span>
                                </div>
                                <button onclick="adjustWeight('${m.id}', 0.5)" class="w-9 h-9 rounded-lg bg-dark-800 hover:bg-dark-700 text-gray-200 font-black text-xs transition">+0.5</button>
                            </div>
                        </div>

                        <button onclick="simulateScale('${m.id}')" class="w-full py-2 rounded-xl bg-dark-850 hover:bg-dark-800 border border-dark-700 text-[11px] font-bold text-gray-400 hover:text-gold-400 transition">
                            はかり計測値を取得 (テスト測定)
                        </button>
                    </div>
                `}).join('');
            }

            // Render Customers Tab
            const cGrid = document.getElementById('customers-grid');
            if (appState.projects.length === 0) {
                cGrid.innerHTML = '<div class="col-span-full text-center py-10 text-gray-500 text-xs font-bold uppercase tracking-wider bg-dark-900/60 rounded-2xl border border-dark-800">「案件登録」タブから現場を登録するとここに表示されます</div>';
            } else {
                cGrid.innerHTML = appState.projects.map(p => `
                    <div class="bg-dark-900 border border-dark-700/90 rounded-2xl p-5 space-y-4 shadow-lg">
                        <div class="flex items-start justify-between gap-3 border-b border-dark-800 pb-3">
                            <div>
                                <h4 class="font-black text-white text-base tracking-tight">${p.name}</h4>
                                <p class="text-xs text-gray-400 mt-0.5">${p.address || '住所未登録'}</p>
                            </div>
                            <select onchange="updateProjectStatus('${p.id}', this.value)" class="bg-dark-950 border border-dark-700 rounded-xl px-3 py-1.5 text-xs font-extrabold text-gold-400 focus:outline-none focus:border-gold-500">
                                <option value="見積中" ${p.status==='見積中'?'selected':''}>見積中</option>
                                <option value="施工予定" ${p.status==='施工予定'?'selected':''}>施工予定</option>
                                <option value="施工中" ${p.status==='施工中'?'selected':''}>施工中</option>
                                <option value="完工済" ${p.status==='完工済'?'selected':''}>完工済</option>
                            </select>
                        </div>

                        <div class="grid grid-cols-2 gap-2 text-xs bg-dark-950/90 border border-dark-800 rounded-xl p-3">
                            <div>
                                <span class="text-[10px] text-gray-500 block">使用塗料</span>
                                <span class="font-bold text-gray-200">${p.paint || '-'}</span>
                            </div>
                            <div>
                                <span class="text-[10px] text-gray-500 block">指定色</span>
                                <span class="font-extrabold text-gold-400">${p.color || '-'}</span>
                            </div>
                            <div class="col-span-2 pt-1.5 border-t border-dark-800/80 flex justify-between text-[11px] text-gray-400">
                                <span>着工: <strong class="text-gray-200">${p.startDate || '-'}</strong></span>
                                <span>完工予定: <strong class="text-gray-200">${p.endDate || '-'}</strong></span>
                            </div>
                        </div>

                        ${p.notes ? `<div class="text-xs text-gray-300 bg-dark-850 border border-dark-700/70 p-3 rounded-xl leading-relaxed">${p.notes}</div>` : ''}

                        <div class="pt-1">
                            <div class="flex items-center justify-between mb-2.5">
                                <span class="text-xs font-extrabold text-gray-400 uppercase tracking-wider">現場アルバム (${(p.photos||[]).length})</span>
                                <label class="cursor-pointer bg-dark-850 hover:bg-dark-800 text-gold-400 text-xs font-bold px-3 py-1.5 rounded-xl border border-gold-500/40 transition">
                                    写真を追加
                                    <input type="file" accept="image/*" multiple class="hidden" onchange="handlePhotoUpload('${p.id}', this)">
                                </label>
                            </div>
                            <div class="flex gap-2.5 overflow-x-auto no-scrollbar pb-1">
                                ${(p.photos||[]).length === 0
                                    ? '<span class="text-[11px] text-gray-600 py-2">写真はまだ登録されていません</span>'
                                    : (p.photos||[]).map(src => `<img src="${src}" onclick="openPhotoModal('${src}')" class="w-20 h-20 object-cover rounded-xl border border-dark-700 hover:border-gold-400 cursor-pointer flex-shrink-0 transition">`).join('')
                                }
                            </div>
                        </div>
                    </div>
                `).join('');
            }
        }

        startSyncListener();
    </script>
</body>
</html>
